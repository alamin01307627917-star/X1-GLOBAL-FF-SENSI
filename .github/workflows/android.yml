name: Build X1 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Capacitor
        run: |
          mkdir -p www
          cp index.html logo.png manifest.webmanifest sw.js www/
          npm init -y
          npm install @capacitor/core@6
          npm install -D @capacitor/cli@6
          npm install @capacitor/android@6
          npx cap init "X1 Global FF Sensi" "com.alamin.x1globalsensi" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: X1-Global-FF-Sensi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
